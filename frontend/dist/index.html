    <!-- 加载屏幕 -->
    <div id="loading-screen" class="loading-screen">
      <svg class="loading-logo" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="50" r="45" stroke="rgba(255,255,255,0.3)" stroke-width="3"/>
        <path d="M50 10 L70 30 L50 50 L30 30 Z" fill="white" opacity="0.9"/>
        <path d="M50 50 L70 70 L50 90 L30 70 Z" fill="white" opacity="0.7"/>
        <circle cx="50" cy="50" r="8" fill="white"/>
      </svg>
      
      <h1 class="loading-text">喀迈拉计划</h1>
      <p class="loading-subtitle">导演椅WebUI 正在启动...</p>
      
      <div class="loading-spinner"></div>
    </div>
    
    <!-- React应用根节点 -->
    <div id="root"></div>
    
    <!-- 应用脚本 -->
    
    
    <!-- 加载完成处理 -->
    <script>
      // 页面加载完成后隐藏加载屏幕
      window.addEventListener('load', function() {
        setTimeout(function() {
          const loadingScreen = document.getElementById('loading-screen');
          const root = document.getElementById('root');
          
          if (loadingScreen) {
            loadingScreen.classList.add('hidden');
            setTimeout(function() {
              loadingScreen.remove();
            }, 500);
          }
          
          if (root) {
            root.classList.add('loaded');
          }
        }, 1000); // 最少显示1秒加载屏幕
      });
      
      // 错误处理
      window.addEventListener('error', function(e) {
        console.error('应用加载错误:', e.error);
        const loadingScreen = document.getElementById('loading-screen');
        if (loadingScreen) {
          loadingScreen.innerHTML = `
            <div style="text-align: center; color: white;">
              <h1 style="color: #ef4444; margin-bottom: 1rem;">⚠️ 加载失败</h1>
              <p style="margin-bottom: 2rem;">应用无法正常加载，请检查网络连接或刷新页面重试。</p>
              <button onclick="window.location.reload()" style="
                background: white;
                color: #1f2937;
                border: none;
                padding: 12px 24px;
                border-radius: 6px;
                font-size: 1rem;
                font-weight: 600;
                cursor: pointer;
                transition: all 0.2s;
              " onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'">
                刷新页面
              </button>
            </div>
          `;
        }
      });
      
      // 性能监控
      if ('performance' in window) {
        window.addEventListener('load', function() {
          setTimeout(function() {
            const perfData = performance.getEntriesByType('navigation')[0];
            if (perfData) {
              console.log('页面加载性能:', {
                DNS查询: perfData.domainLookupEnd - perfData.domainLookupStart,
                TCP连接: perfData.connectEnd - perfData.connectStart,
                请求响应: perfData.responseEnd - perfData.requestStart,
                DOM解析: perfData.domContentLoadedEventEnd - perfData.responseEnd,
                总加载时间: perfData.loadEventEnd - perfData.navigationStart
              });
            }
          }, 0);
        });
      }
    </script>
